<script>
        // Simple Interaction logic for dropdown simulation
        document.querySelectorAll('button.border-outline-variant').forEach(btn => {
            btn.addEventListener('click', function() {
                this.classList.toggle('border-primary');
                this.classList.toggle('ring-4');
                this.classList.toggle('ring-primary/10');
            });
        });

        // AR Button Ripple Effect
        const arBtn = document.querySelector('button.bg-brand-blue');
        arBtn.addEventListener('click', function(e) {
            let x = e.clientX - e.target.offsetLeft;
            let y = e.clientY - e.target.offsetTop;
            
            let ripple = document.createElement('span');
            ripple.style.left = x + 'px';
            ripple.style.top = y + 'px';
            ripple.classList.add('absolute', 'w-4', 'h-4', 'bg-white/30', 'rounded-full', 'animate-ping');
            this.appendChild(ripple);
            
            setTimeout(() => {
                ripple.remove();
            }, 1000);
        });
    </script>
